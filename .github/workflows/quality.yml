name: Source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ln -s ../../desktop/node_modules ../vendor/drawnix/node_modules
      - run: bun run lint -- --quiet
      - run: bun run format:check
      - run: bunx tsc --noEmit
      - run: node scripts/check-i18n.js
      - run: bun run test -- --maxWorkers=2
      - run: bunx vitest run --maxWorkers=2 --config tests/regression/studio/vitest.config.ts -t normal
      - run: bunx vitest run --maxWorkers=2 --config tests/regression/studio/vitest.config.ts -t adversarial
      - run: bun run package
